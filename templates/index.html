<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94A3B8;
            font-size: 1.1rem;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 2rem auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #CBD5E1;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-positive {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #FCA5A5;
        }

        .result-negative {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #6EE7B7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .data-viz {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .data-viz img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Heart Disease Prediction AI</h1>
        <p class="subtitle">Enter patient clinical parameters for an instant assessment</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Patient Details</h2>
            <form id="prediction-form">
                <div class="grid-2col">
                    <div class="form-group">
                        <label for="age">Age (years)</label>
                        <input type="number" id="age" name="age" required value="50">
                    </div>
                    <div class="form-group">
                        <label for="sex">Sex (1=Male, 0=Female)</label>
                        <input type="number" id="sex" name="sex" min="0" max="1" required value="1">
                    </div>
                </div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label for="cp">Chest Pain Type (0-3)</label>
                        <input type="number" id="cp" name="cp" min="0" max="3" required value="2">
                    </div>
                    <div class="form-group">
                        <label for="trestbps">Resting Blood Pressure</label>
                        <input type="number" id="trestbps" name="trestbps" required value="120">
                    </div>
                </div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label for="chol">Serum Cholestoral (mg/dl)</label>
                        <input type="number" id="chol" name="chol" required value="240">
                    </div>
                    <div class="form-group">
                        <label for="fbs">Fasting Blood Sugar > 120 (1=True, 0=False)</label>
                        <input type="number" id="fbs" name="fbs" min="0" max="1" required value="0">
                    </div>
                </div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label for="restecg">Resting ECG Results (0-2)</label>
                        <input type="number" id="restecg" name="restecg" min="0" max="2" required value="1">
                    </div>
                    <div class="form-group">
                        <label for="thalach">Max Heart Rate Achieved</label>
                        <input type="number" id="thalach" name="thalach" required value="150">
                    </div>
                </div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label for="exang">Exercise Induced Angina (1=Yes, 0=No)</label>
                        <input type="number" id="exang" name="exang" min="0" max="1" required value="0">
                    </div>
                    <div class="form-group">
                        <label for="oldpeak">ST Depression (Oldpeak)</label>
                        <input type="number" step="0.1" id="oldpeak" name="oldpeak" required value="1.0">
                    </div>
                </div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label for="slope">Slope of Peak Exercise ST Segment (0-2)</label>
                        <input type="number" id="slope" name="slope" min="0" max="2" required value="2">
                    </div>
                    <div class="form-group">
                        <label for="ca">Number of Major Vessels (0-4)</label>
                        <input type="number" id="ca" name="ca" min="0" max="4" required value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="thal">Thal (1=normal; 2=fixed defect; 3=reversable defect)</label>
                    <input type="number" id="thal" name="thal" min="0" max="3" required value="2">
                </div>

                <button type="submit">Predict Risk</button>
            </form>

            <div id="result-box" class="result-container"></div>
        </div>

        <div class="card data-viz">
            <h2>Model Insights</h2>
            <p>Our Random Forest model analyzes these factors using patterns learned from the dataset.</p>
            <img src="/static/target_distribution.png" alt="Target Distribution Graph">
            <img src="/static/correlation_matrix.png" alt="Feature Correlation Heatmap">
        </div>
    </div>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Convert strings to numbers
            for (let key in data) {
                data[key] = Number(data[key]);
            }
            
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Analyzing...';
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const resultBox = document.getElementById('result-box');
                
                resultBox.style.display = 'block';
                resultBox.textContent = result.prediction;
                
                if (result.prediction === "Heart Disease Detected") {
                    resultBox.className = 'result-container result-positive';
                } else {
                    resultBox.className = 'result-container result-negative';
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while getting the prediction.");
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
